version: '3.8'

services:
  api:
    build: .
    container_name: agent-task-api
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/agent_tasks
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - DEBUG=${DEBUG:-true}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./src:/app/src
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - agent-task-network

  db:
    image: postgres:15-alpine
    container_name: agent-task-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=agent_tasks
    volumes:
      - backend_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - agent-task-network

  redis:
    image: redis:7-alpine
    container_name: agent-task-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - agent-task-network

volumes:
  backend_postgres_data:
    external: true
  redis_data:

networks:
  agent-task-network:
    driver: bridge
